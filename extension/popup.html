<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <title>Web Keeper</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f4f8; --surface: #ffffff; --surface2: #f7f9fc;
      --border: #e2e8f0; --border-strong: #c7d2e0;
      --text: #0f172a; --muted: #64748b;
      --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eff4ff;
      --ok: #15803d; --warn: #9a6700; --bad: #b42318;
      --ok-soft: #ecfdf3; --bad-soft: #fef3f2;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220; --surface: #121a2b; --surface2: #182338;
        --border: #263349; --border-strong: #35455f;
        --text: #e2e8f0; --muted: #94a3b8;
        --accent: #3b82f6; --accent-hover: #60a5fa; --accent-soft: #1a2a4a;
        --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
        --ok-soft: #12291c; --bad-soft: #331512;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 380px; background: var(--bg); color: var(--text); font-size: 13px; }
    header { padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .logo { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--accent); font-weight: 800; }
    .pill { border-radius: 999px; padding: 3px 9px; font-size: 12px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); }
    .pill.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
    .pill.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
    main { padding: 12px; display: grid; gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .between { justify-content: space-between; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    .label { color: var(--muted); font-size: 12px; }
    .value { font-size: 18px; font-weight: 700; margin-top: 2px; }
    button { border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); color: var(--text); padding: 7px 11px; cursor: pointer; font: inherit; font-weight: 550; }
    button:hover { background: var(--surface2); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    button.danger { color: var(--bad); }
    input[type="text"] { width: 100%; border: 1px solid var(--border-strong); border-radius: 7px; padding: 8px; font: 12px Consolas, monospace; background: var(--surface2); color: var(--text); }
    input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .switch { position: relative; width: 42px; height: 24px; }
    .switch input { display: none; }
    .slider { position: absolute; inset: 0; cursor: pointer; background: var(--border-strong); border-radius: 999px; transition: .15s; }
    .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: .15s; box-shadow: 0 1px 3px #0003; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider:before { transform: translateX(18px); }
    .list { display: grid; gap: 8px; max-height: 174px; overflow: auto; }
    .item { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--surface2); }
    .item-title { font: 12px Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .muted { color: var(--muted); font-size: 12px; }
    progress { width: 100%; height: 10px; accent-color: var(--accent); }
    footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); }
    #toast { min-height: 16px; color: var(--muted); font-size: 12px; padding: 0 12px 10px; background: var(--surface); }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand"><div class="logo">W</div><div>Web Keeper</div></div>
      <div id="connection" class="pill">checking</div>
    </div>
  </header>
  <main>
    <section class="card">
      <div class="row between">
        <label class="toggle">
          <span class="switch"><input id="discover" type="checkbox"><span class="slider"></span></span>
          <span>Discover</span>
        </label>
        <label class="toggle">
          <span class="switch"><input id="enabled" type="checkbox"><span class="slider"></span></span>
          <span>Capture</span>
        </label>
      </div>
      <div style="margin-top:10px">
        <input id="serverUrl" type="text" title="Local server URL">
      </div>
    </section>

    <section class="grid">
      <div class="stat"><div class="label">Candidates</div><div id="candidateCount" class="value">0</div></div>
      <div class="stat"><div class="label">Jobs</div><div id="jobCount" class="value">0</div></div>
      <div class="stat"><div class="label">Saved</div><div id="savedCount" class="value">0</div></div>
    </section>

    <section class="card">
      <div class="row between" style="margin-bottom:8px">
        <strong>Downloadable</strong>
        <button id="refresh">Refresh</button>
      </div>
      <div id="candidates" class="list"><div class="muted">No candidates yet.</div></div>
    </section>

    <section class="card">
      <div class="row between" style="margin-bottom:8px">
        <strong>Progress</strong>
        <span id="speed" class="muted">0 MB/s</span>
      </div>
      <div id="jobs" class="list"><div class="muted">No active jobs.</div></div>
    </section>
  </main>
  <footer>
    <div class="row">
      <button id="save">Save</button>
      <button id="start" class="primary">Start</button>
      <button id="stop" class="danger">Stop</button>
    </div>
    <button id="open">Dashboard</button>
  </footer>
  <div id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
