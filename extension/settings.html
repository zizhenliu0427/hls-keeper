<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Keeper</title>
  <style>
    :root { color-scheme:light dark; --bg:#f3f6fb; --card:#fff; --line:#d9e1ec; --text:#172033; --muted:#667085; --blue:#2563eb; font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif; }
    @media (prefers-color-scheme:dark) { :root { --bg:#0c1422; --card:#131d2f; --line:#2b3a52; --text:#e7edf7; --muted:#9aa9bd; --blue:#3b82f6; } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,"Microsoft YaHei UI",sans-serif; }
    header { padding:18px 22px; border-bottom:1px solid var(--line); background:var(--card); } header div, main { max-width:760px; margin:auto; }
    h1 { margin:0; font-size:21px; } main { padding:22px 16px 50px; display:grid; gap:14px; }
    .card { padding:18px; border:1px solid var(--line); border-radius:14px; background:var(--card); } .muted { color:var(--muted); }
    label.field { display:grid; gap:7px; margin-top:16px; font-weight:650; } select { width:100%; padding:9px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--text); font:inherit; }
    .check { display:flex; align-items:center; gap:8px; font-weight:400; } button, a { display:inline-flex; padding:9px 14px; border:1px solid var(--line); border-radius:9px; color:var(--text); background:var(--card); text-decoration:none; font:inherit; font-weight:650; cursor:pointer; }
    button.primary { background:var(--blue); border-color:var(--blue); color:#fff; } .actions { display:flex; gap:9px; margin-top:20px; } #message { min-height:22px; margin-top:10px; color:var(--muted); }
  </style>
</head>
<body>
  <header><div><h1 data-i18n="settingsTitle">设置</h1><div class="muted" data-i18n="settingsDescription">设置只影响之后的操作，不会移动或删除已有文件。</div></div></header>
  <main>
    <section class="card">
      <label class="field"><span data-i18n="language">界面语言</span>
        <select id="language"><option value="auto" data-i18n="languageAuto">跟随浏览器</option><option value="zh_CN" data-i18n="languageChinese">简体中文</option><option value="en" data-i18n="languageEnglish">English</option></select>
      </label>
      <label class="field"><span data-i18n="recommendedMethod">默认推荐方式</span>
        <select id="method"><option value="ask" data-i18n="askEveryTime">每次询问</option><option value="direct" data-i18n="preferDirect">优先推荐直接下载</option><option value="browser-assisted" data-i18n="preferAssisted">优先推荐网页辅助</option></select>
      </label>
      <label class="field"><span data-i18n="defaultQuality">默认清晰度</span>
        <select id="quality"><option value="highest" data-i18n="qualityHighest">最高可用清晰度</option><option value="last" data-i18n="qualityLastUsed">沿用上次选择</option></select>
      </label>
      <label class="field"><span data-i18n="saveDestination">成品保存方式</span>
        <select id="destination"><option value="browser-downloads" data-i18n="browserDownloads">浏览器 Downloads（推荐）</option><option value="custom-folder" data-i18n="customFolder">自选文件夹</option></select>
      </label>
      <div id="customFolderOptions">
        <label class="field"><span data-i18n="defaultSaveLocation">自选保存位置</span><span id="directoryName" class="muted" data-i18n="noDefaultSaveLocation">尚未选择</span></label>
        <div class="actions"><button id="chooseDirectory" data-i18n="chooseSaveLocation">选择保存位置</button><button id="forgetDirectory" data-i18n="forgetSaveLocation">忘记此位置</button></div>
      </div>
      <label class="field"><span data-i18n="directConcurrency">直接下载速度</span>
        <select id="concurrency"><option value="2" data-i18n="concurrencyStable">稳定（2 路）</option><option value="4" data-i18n="concurrencyBalanced">均衡（4 路，推荐）</option><option value="6" data-i18n="concurrencyFast">较快（6 路）</option></select>
      </label>
      <label class="field"><span data-i18n="completionBehavior">下载完成后</span>
        <span class="check"><input id="autoFinalize" type="checkbox"><span data-i18n="autoFinalize">自动生成可播放视频</span></span>
        <span class="check"><input id="cleanupAfterMerge" type="checkbox"><span data-i18n="cleanupAfterMerge">生成成功后自动删除临时切片</span></span>
      </label>
      <label class="field"><span data-i18n="advancedSettings">高级设置</span><span class="check"><input id="diagnostics" type="checkbox"><span data-i18n="showDiagnostics">在下载页面显示诊断信息入口</span></span></label>
      <div class="actions"><button id="save" class="primary" data-i18n="saveSettings">保存设置</button><a href="download.html" data-i18n="openDownloadCenter">下载中心</a></div>
      <div id="message" role="status"></div>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
</body>
</html>
